<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        button {
            padding: 8px 15px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Faculty Attendance Management</h1>

    <form method="POST">
        <table>
            <tr>
                <th>Student Email</th>
                <th>Attendance Date</th>
                <th>Status</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.email }}</td>
                <td>
                    <input type="date" name="date_{{ student.id }}" required>
                </td>
                <td>
                    <select name="status_{{ student.id }}">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </td>
            </tr>
            {% endfor %}
        </table>

        <br>
        <button type="submit">Save Attendance</button>
    </form>

    <br>
    <a href="/faculty">Back to Dashboard</a>
</div>
</body>
</html>
