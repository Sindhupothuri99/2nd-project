<!DOCTYPE html>
<html>
<head>
    <title>EduPrime - Create {{ role }} Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
        }
        header {
            background: #172554;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0001;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .message {
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            margin-bottom: 15px;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
<header>
    <h2>EduPrime Admin</h2>
</header>

<div class="container">
    <h2>Create {{ role }} Account</h2>

    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="message">{{ success }}</div>
    {% endif %}

    <form method="POST">
        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Password (minimum 8 characters)</label>
        <input type="password" name="password" minlength="8" required>

        <button type="submit">Create {{ role }} Account</button>
    </form>

    <p><a href="/admin">← Back to Dashboard</a></p>
</div>
</body>
</html>
