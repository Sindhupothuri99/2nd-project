<!DOCTYPE html>
<html>
<head>
    <title>EduPrime Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ccc;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>EduPrime</h2>
    <h3>{{ role }} Login</h3>

    <form method="POST">
        <input type="email" name="email"
               placeholder="Enter Email" required>

        <input type="password" name="password"
               placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <a href="/">Back to Home</a>

    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
</div>

</body>
</html>
