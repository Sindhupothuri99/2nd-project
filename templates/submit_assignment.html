<!DOCTYPE html>
<html>
<head>
    <title>Submit Assignment - EduPrime</title>
</head>
<body style="font-family:Arial;background:#f1f5f9;padding:30px">

    <h1>Submit Assignment</h1>

    {% for assignment in assignments %}
    <div style="background:white;padding:20px;margin-bottom:20px;border-radius:10px">

        <h2>{{ assignment.title }}</h2>
        <p>{{ assignment.description }}</p>
        <p><b>Due Date:</b> {{ assignment.due_date }}</p>

        <form method="POST" action="/student/assignments/{{ assignment.id }}/submit">
            <textarea name="content"
                      placeholder="Enter your assignment answer"
                      rows="5"
                      required></textarea>
            <br><br>
            <button type="submit">Submit Assignment</button>
        </form>

    </div>
    {% else %}
        <p>No assignments available.</p>
    {% endfor %}

    <a href="/student">Back to Dashboard</a>

</body>
</html>
